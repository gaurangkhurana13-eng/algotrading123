name: Tri-Engine Live Cloud Forward-Tester (V43 Titan + V3 Bull + V3 Bear)

on:
  schedule:
    # 03:20 UTC = 08:50 AM IST (Mon-Fri) to beat GitHub cron queue delay before 09:15 IST open
    - cron: '20 3 * * 1-5'
  workflow_dispatch: # Allows manual 1-click start anytime from phone or web

jobs:
  run-tri-engine-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 355 # Covers 09:15 IST through 15:25 IST clean EOD shutdown without hitting 360m hard kill

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tri-Engine Live Cloud Forward-Tester
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -u scripts/live_telegram_forward_tester.py --live
